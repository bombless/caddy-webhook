name: Build and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whole-site-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: dist/
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-site
          path: site
      - name: Validate whole-site webhook configuration
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL || 'https://bombless.duckdns.org/_deploy' }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_TOKEN:-}" || { echo "::error::DEPLOY_TOKEN secret is required"; exit 1; }
          test -n "${DEPLOY_WEBHOOK_URL:-}" || { echo "::error::DEPLOY_WEBHOOK_URL secret is required"; exit 1; }
          echo "::add-mask::${DEPLOY_TOKEN}"
          node --input-type=module <<'NODE'
          const url = new URL(process.env.DEPLOY_WEBHOOK_URL);
          if (url.protocol !== 'https:' || !url.pathname.endsWith('/_deploy') ||
              url.username || url.password) {
            throw new Error('DEPLOY_WEBHOOK_URL must be HTTPS and end with /_deploy');
          }
          NODE
      - name: Package and deploy complete site release
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL || 'https://bombless.duckdns.org/_deploy' }}
        run: |
          set -euo pipefail
          echo "::add-mask::${DEPLOY_TOKEN}"
          test -f site/index.html || { echo "::error::site/index.html is required"; exit 1; }
          (cd site && zip -qr ../site.zip .)
          curl --fail-with-body --show-error --silent --retry 0 \
            --connect-timeout 15 --max-time 180 \
            -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H 'Content-Type: application/zip' \
            --data-binary @site.zip
