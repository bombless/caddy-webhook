name: Publish Snake package

on:
  push:
    branches: [main]
    paths:
      - "demo/game.c"
      - "demo/games/snake/manifest.json"
      - ".github/workflows/publish-snake.yml"

permissions:
  contents: read

concurrency:
  group: snake-package-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WASM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Build immutable Snake package
        run: |
          set -euo pipefail
          mkdir -p package
          cp demo/games/snake/manifest.json package/manifest.json
          clang --target=wasm32 -O2 -fno-builtin -nostdlib \
            -Wl,--no-entry -Wl,--export-memory \
            -Wl,--initial-memory=262144 -Wl,--max-memory=1048576 \
            -Wl,-z,stack-size=32768 -Wl,--strip-all \
            -o package/game.wasm demo/game.c
          test -s package/game.wasm
          node --input-type=module <<'NODE'
          import { readFileSync, statSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package/manifest.json', 'utf8'));
          if (manifest.id !== 'snake-arcade' || manifest.pluginType !== 'wasm' ||
              manifest.entry !== 'game.wasm' || !/^\\d+\\.\\d+\\.\\d+$/.test(manifest.version)) {
            throw new Error('Unexpected Snake package manifest');
          }
          console.log(`Built ${manifest.id}@${manifest.version}: ${statSync('package/game.wasm').size} bytes`);
          NODE
          (cd package && zip -qr ../snake-package.zip .)
      - name: Publish immutable package
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          GAME_DEPLOY_WEBHOOK_URL: ${{ secrets.GAME_DEPLOY_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_TOKEN:-}" || { echo "::error::DEPLOY_TOKEN secret is required"; exit 1; }
          test -n "${GAME_DEPLOY_WEBHOOK_URL:-}" || { echo "::error::GAME_DEPLOY_WEBHOOK_URL secret is required"; exit 1; }
          echo "::add-mask::${DEPLOY_TOKEN}"
          node --input-type=module <<'NODE'
          const url = new URL(process.env.GAME_DEPLOY_WEBHOOK_URL);
          if (url.protocol !== 'https:' || !url.pathname.endsWith('/_deploy/game') || url.username || url.password) {
            throw new Error('GAME_DEPLOY_WEBHOOK_URL must be HTTPS and end with /_deploy/game');
          }
          NODE
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl --silent --show-error --retry 0 --connect-timeout 15 --max-time 180 \
            --output "$body" --write-out '%{http_code}' \
            -X POST -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H 'Content-Type: application/zip' --data-binary @snake-package.zip \
            "$GAME_DEPLOY_WEBHOOK_URL")"
          cat "$body"
          case "$status" in
            2*) echo "Snake package published." ;;
            409) echo "::error::This Snake version is already published (immutable version conflict)."; exit 1 ;;
            400) echo "::error::Webhook rejected the Snake package."; exit 1 ;;
            401) echo "::error::Webhook rejected DEPLOY_TOKEN."; exit 1 ;;
            413) echo "::error::Snake package exceeds the webhook upload limit."; exit 1 ;;
            *) echo "::error::Snake package publication failed with HTTP $status."; exit 1 ;;
          esac
