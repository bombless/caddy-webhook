name: Publish game package

on:
  workflow_dispatch:
    inputs:
      package_dir:
        description: "Directory containing one built game package (manifest.json at its root)"
        required: false
        default: "dist/games/hello-vue3"
        type: string
      build_example:
        description: "Build the checked-in Vue example before packaging (disable for a prebuilt custom/WASM package)"
        required: false
        default: true
        type: boolean
      build_snake:
        description: "Compile the checked-in WASM Snake game into the package directory"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: game-package-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build platform and example package
        if: ${{ inputs.build_example }}
        run: |
          npm install
          npm run build
      - name: Install WASM toolchain
        if: ${{ inputs.build_snake }}
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Build Snake WASM module
        if: ${{ inputs.build_snake }}
        env:
          PACKAGE_DIR: ${{ inputs.package_dir }}
        run: |
          set -euo pipefail
          test -f demo/game.c || { echo "::error::demo/game.c not found on selected ref"; exit 1; }
          test -f "$PACKAGE_DIR/manifest.json" || { echo "::error::Snake package manifest not found"; exit 1; }
          clang --target=wasm32 -O2 -fno-builtin -nostdlib \
            -Wl,--no-entry -Wl,--export-memory \
            -Wl,--initial-memory=262144 -Wl,--max-memory=1048576 \
            -Wl,-z,stack-size=32768 -Wl,--strip-all \
            -o "$PACKAGE_DIR/game.wasm" demo/game.c
          test -s "$PACKAGE_DIR/game.wasm"
      - name: Prepare package archive
        env:
          PACKAGE_DIR: ${{ inputs.package_dir }}
        run: |
          set -euo pipefail
          test -d "$PACKAGE_DIR" || { echo "::error::Package directory not found: $PACKAGE_DIR"; exit 1; }
          test -f "$PACKAGE_DIR/manifest.json" || { echo "::error::manifest.json must be at package root"; exit 1; }
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'node:fs';
          const root = process.env.PACKAGE_DIR;
          const manifest = JSON.parse(readFileSync(root + '/manifest.json', 'utf8'));
          if (manifest.manifestVersion !== 1 || !manifest.id || !manifest.version || !manifest.entry) {
            throw new Error('manifest.json is missing required package fields');
          }
          if (!existsSync(root + '/' + manifest.entry)) throw new Error('declared entry does not exist');
          console.log(`Publishing ${manifest.id}@${manifest.version} (${manifest.pluginType})`);
          NODE
          rm -rf package-archive game-package.zip
          mkdir package-archive
          rsync -a "$PACKAGE_DIR"/ package-archive/
          (cd package-archive && zip -qr ../game-package.zip .)
          test -s game-package.zip
      - name: Validate deployment configuration
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          GAME_DEPLOY_WEBHOOK_URL: ${{ secrets.GAME_DEPLOY_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_TOKEN:-}" || { echo "::error::DEPLOY_TOKEN secret is required"; exit 1; }
          test -n "${GAME_DEPLOY_WEBHOOK_URL:-}" || { echo "::error::GAME_DEPLOY_WEBHOOK_URL secret is required"; exit 1; }
          echo "::add-mask::${DEPLOY_TOKEN}"
          node --input-type=module <<'NODE'
          const url = new URL(process.env.GAME_DEPLOY_WEBHOOK_URL);
          if (url.protocol !== 'https:' || !url.pathname.endsWith('/_deploy/game') || url.username || url.password) {
            throw new Error('GAME_DEPLOY_WEBHOOK_URL must be HTTPS and end with /_deploy/game');
          }
          NODE
      - name: Publish immutable game package
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          GAME_DEPLOY_WEBHOOK_URL: ${{ secrets.GAME_DEPLOY_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          echo "::add-mask::${DEPLOY_TOKEN}"
          body="$(mktemp)"
          trap 'rm -f "$body"' EXIT
          status="$(curl --silent --show-error --retry 0 --connect-timeout 15 --max-time 180 \
            --output "$body" --write-out '%{http_code}' \
            -X POST -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H 'Content-Type: application/zip' --data-binary @game-package.zip \
            "$GAME_DEPLOY_WEBHOOK_URL")"
          cat "$body"
          case "$status" in
            2*) echo "Game package published." ;;
            409) echo "::error::This game ID/version has already been published (immutable version conflict)."; exit 1 ;;
            400) echo "::error::Webhook rejected the package ZIP or manifest."; exit 1 ;;
            401) echo "::error::Webhook rejected DEPLOY_TOKEN."; exit 1 ;;
            413) echo "::error::Package upload exceeds the webhook size limit."; exit 1 ;;
            *) echo "::error::Game package publication failed with HTTP $status."; exit 1 ;;
          esac
